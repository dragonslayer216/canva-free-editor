<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canva-style Editor</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #171d27;
        --panel-2: #1f2833;
        --panel-3: #212b36;
        --muted: #9ba9ba;
        --text: #edf3f9;
        --accent: #3b82f6;
        --accent-2: #64a2ff;
        --canvas-bg: #ffffff;
        --line: rgba(255,255,255,0.08);
        --shadow: 0 18px 45px rgba(0,0,0,0.22);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      .app {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
      }

      .topbar {
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .left-group, .right-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--text);
      }

      .top-btn {
        background: #232d39;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 12px;
        cursor: pointer;
      }

      .top-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
      }

      .main {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .left-toolbar {
        width: 260px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px 14px;
        overflow-y: auto;
      }

      .section {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 12px 10px;
        margin-bottom: 16px;
      }

      .section h4 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .tool-btn, .action-btn {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #2a3744;
        color: var(--text);
        padding: 11px 12px;
        font-size: 13px;
        cursor: pointer;
      }

      .tool-btn:hover, .action-btn:hover, .mini-btn:hover {
        background: #35495d;
      }

      .action-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
      }

      .layout-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 240px;
        overflow-y: auto;
      }

      .layout-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .layout-item.active {
        background: var(--accent);
        border-color: var(--accent);
      }

      .workspace-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d141b;
        padding: 24px;
      }

      .canvas-shell {
        position: relative;
        width: min(82vw, 1180px);
        height: min(76vh, 760px);
        background: var(--canvas-bg);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .canvas {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--canvas-bg);
        overflow: hidden;
        user-select: none;
      }

      .element {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: move;
        border: 2px solid transparent;
        overflow: hidden;
      }

      .element.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(59,130,246,0.24);
      }

      .element.text {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: Arial, sans-serif;
        background: transparent;
        color: #111827;
      }

      .element.image {
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }

      .resize-handle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--accent);
        border: 2px solid white;
        border-radius: 2px;
        display: none;
      }

      .element.selected .resize-handle {
        display: block;
      }

      .nw { top: -6px; left: -6px; cursor: nwse-resize; }
      .ne { top: -6px; right: -6px; cursor: nesw-resize; }
      .sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
      .se { bottom: -6px; right: -6px; cursor: nwse-resize; }

      .right-panel {
        width: 280px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 16px 14px;
        overflow-y: auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field label {
        font-size: 12px;
        color: var(--muted);
      }

      .field input,
      .field select {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
      }

      input[type="color"] {
        min-height: 36px;
        padding: 4px;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        cursor: pointer;
      }

      .mini-row {
        display: flex;
        gap: 8px;
      }

      .mini-btn {
        flex: 1;
        border: 1px solid var(--line);
        background: #2a3744;
        border-radius: 10px;
        color: var(--text);
        padding: 10px 8px;
        cursor: pointer;
        font-size: 12px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 980px) {
        .main {
          flex-direction: column;
        }

        .left-toolbar, .right-panel {
          width: 100%;
          border: none;
          border-bottom: 1px solid var(--line);
        }

        .workspace-wrap {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="left-group">
          <div class="brand">Canva-Style</div>
        </div>

        <div class="right-group">
          <button class="top-btn" id="saveBtn">Save</button>
          <button class="top-btn" id="loadBtn">Load</button>
          <button class="top-btn primary" id="exportBtn">Export PNG</button>
        </div>
      </header>

      <div class="main">
        <aside class="left-toolbar">
          <div class="section">
            <h4>Add</h4>
            <div class="stack">
              <button class="tool-btn" id="textBtn">Text</button>
              <button class="tool-btn" id="rectBtn">Rectangle</button>
              <button class="tool-btn" id="circleBtn">Circle</button>
              <button class="tool-btn" id="imageBtn">Image</button>
            </div>
          </div>

          <div class="section">
            <h4>Arrange</h4>
            <div class="stack">
              <button class="action-btn" id="duplicateBtn">Duplicate</button>
              <button class="action-btn" id="deleteBtn">Delete</button>
              <button class="action-btn" id="frontBtn">Bring to Front</button>
              <button class="action-btn" id="backBtn">Send to Back</button>
            </div>
          </div>

          <div class="section">
            <h4>Layers</h4>
            <ul class="layout-list" id="layerList"></ul>
          </div>
        </aside>

        <main class="workspace-wrap">
          <div class="canvas-shell">
            <div id="canvas" class="canvas" aria-label="Design canvas"></div>
          </div>
        </main>

        <aside class="right-panel">
          <div class="section" style="padding: 12px; margin-bottom: 16px;">
            <h4>Properties</h4>
            <div class="grid">
              <div class="field">
                <label>X</label>
                <input id="xInput" type="number" value="0" />
              </div>
              <div class="field">
                <label>Y</label>
                <input id="yInput" type="number" value="0" />
              </div>
              <div class="field">
                <label>W</label>
                <input id="wInput" type="number" value="120" />
              </div>
              <div class="field">
                <label>H</label>
                <input id="hInput" type="number" value="80" />
              </div>
            </div>

            <div class="field">
              <label>Color</label>
              <input id="colorInput" type="color" value="#3b82f6" />
              <div class="swatches">
                <div class="swatch" data-color="#ef4444" style="background:#ef4444"></div>
                <div class="swatch" data-color="#f97316" style="background:#f97316"></div>
                <div class="swatch" data-color="#eab308" style="background:#eab308"></div>
                <div class="swatch" data-color="#22c55e" style="background:#22c55e"></div>
                <div class="swatch" data-color="#3b82f6" style="background:#3b82f6"></div>
                <div class="swatch" data-color="#8b5cf6" style="background:#8b5cf6"></div>
                <div class="swatch" data-color="#111827" style="background:#111827"></div>
                <div class="swatch" data-color="#ffffff" style="background:#ffffff"></div>
              </div>
            </div>

            <div class="field hidden" id="textField">
              <label>Text</label>
              <input id="textInput" type="text" value="Edit me" />
            </div>

            <div class="field hidden" id="fontField">
              <label>Font size</label>
              <input id="fontSizeInput" type="number" value="32" min="8" max="120" />
            </div>

            <div class="field">
              <label>Opacity</label>
              <input id="opacityInput" type="range" min="0" max="100" value="100" />
            </div>

            <div class="field">
              <label>Rotation</label>
              <input id="rotationInput" type="range" min="0" max="360" value="0" />
            </div>
          </div>

          <div class="section" style="padding: 12px;">
            <h4>Align</h4>
            <div class="mini-row">
              <button class="mini-btn" id="alignLeftBtn">Left</button>
              <button class="mini-btn" id="alignCenterBtn">Center</button>
              <button class="mini-btn" id="alignTopBtn">Top</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <input type="file" id="imageUpload" class="hidden" accept="image/*" />

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      const canvas = document.getElementById('canvas');
      const layerList = document.getElementById('layerList');
      const imageUpload = document.getElementById('imageUpload');

      const xInput = document.getElementById('xInput');
      const yInput = document.getElementById('yInput');
      const wInput = document.getElementById('wInput');
      const hInput = document.getElementById('hInput');
      const colorInput = document.getElementById('colorInput');
      const textInput = document.getElementById('textInput');
      const fontSizeInput = document.getElementById('fontSizeInput');
      const opacityInput = document.getElementById('opacityInput');
      const rotationInput = document.getElementById('rotationInput');
      const textField = document.getElementById('textField');
      const fontField = document.getElementById('fontField');

      let elements = [];
      let selectedId = null;
      let dragState = null;
      let resizeState = null;

      function uid() {
        return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      }

      function getSelectedElement() {
        return elements.find((el) => el.id === selectedId) || null;
      }

      function syncForm() {
        const el = getSelectedElement();
        if (!el) {
          xInput.value = 0;
          yInput.value = 0;
          wInput.value = 120;
          hInput.value = 80;
          return;
        }

        xInput.value = Math.round(el.x);
        yInput.value = Math.round(el.y);
        wInput.value = Math.round(el.w);
        hInput.value = Math.round(el.h);
        colorInput.value = el.color || '#3b82f6';
        opacityInput.value = el.opacity !== undefined ? el.opacity : 100;
        rotationInput.value = el.rotation || 0;

        if (el.type === 'text') {
          textField.classList.remove('hidden');
          fontField.classList.remove('hidden');
          textInput.value = el.text || '';
          fontSizeInput.value = el.fontSize || 32;
        } else {
          textField.classList.add('hidden');
          fontField.classList.add('hidden');
        }
      }

      function renderLayers() {
        layerList.innerHTML = '';
        [...elements].reverse().forEach((el) => {
          const li = document.createElement('li');
          li.className = 'layout-item' + (el.id === selectedId ? ' active' : '');
          li.textContent = `${el.type} ${el.id.slice(-4)}`;
          li.addEventListener('click', () => {
            selectedId = el.id;
            render();
            syncForm();
          });
          layerList.appendChild(li);
        });
      }

      function render() {
        canvas.innerHTML = '';

        elements.forEach((el, index) => {
          const node = document.createElement('div');
          node.className = `element ${el.type} ${el.id === selectedId ? 'selected' : ''}`;
          node.dataset.id = el.id;
          node.style.left = `${el.x}px`;
          node.style.top = `${el.y}px`;
          node.style.width = `${el.w}px`;
          node.style.height = `${el.h}px`;
          node.style.opacity = (el.opacity ?? 100) / 100;
          node.style.transform = `rotate(${el.rotation || 0}deg)`;
          node.style.zIndex = index + 1;

          if (el.type === 'text') {
            node.classList.add('text');
            node.style.fontSize = `${el.fontSize || 32}px`;
            node.style.color = el.color || '#111827';
            node.style.fontWeight = '600';
            node.textContent = el.text || 'Text';
          } else if (el.type === 'rect') {
            node.style.background = el.color || '#3b82f6';
            node.style.borderRadius = '10px';
          } else if (el.type === 'circle') {
            node.style.background = el.color || '#22c55e';
            node.style.borderRadius = '50%';
          } else if (el.type === 'image') {
            node.classList.add('image');
            node.style.backgroundImage = `url('${el.src}')`;
            node.style.backgroundSize = 'cover';
            node.style.backgroundPosition = 'center';
            node.style.borderRadius = '0';
          }

          ['nw', 'ne', 'sw', 'se'].forEach((corner) => {
            const handle = document.createElement('div');
            handle.className = `resize-handle ${corner}`;
            handle.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              resizeState = {
                id: el.id,
                startX: e.clientX,
                startY: e.clientY,
                origX: el.x,
                origY: el.y,
                origW: el.w,
                origH: el.h,
                corner
              };
            });
            node.appendChild(handle);
          });

          node.addEventListener('pointerdown', (event) => {
            if (event.target.closest('.resize-handle')) return;
            selectedId = el.id;
            render();
            syncForm();

            dragState = {
              id: el.id,
              startX: event.clientX,
              startY: event.clientY,
              origX: el.x,
              origY: el.y
            };
          });

          node.addEventListener('dblclick', () => {
            if (el.type === 'text') {
              const nextText = prompt('Edit text:', el.text || '');
              if (nextText !== null) {
                el.text = nextText;
                render();
                syncForm();
                saveLocal();
              }
            }
          });

          canvas.appendChild(node);
        });

        renderLayers();
      }

      function updateSelected() {
        const el = getSelectedElement();
        if (!el) return;

        el.x = Number(xInput.value) || 0;
        el.y = Number(yInput.value) || 0;
        el.w = Number(wInput.value) || 80;
        el.h = Number(hInput.value) || 60;
        el.opacity = Number(opacityInput.value) || 100;
        el.rotation = Number(rotationInput.value) || 0;

        if (el.type === 'text') {
          el.text = textInput.value;
          el.fontSize = Number(fontSizeInput.value) || 32;
        }

        el.color = colorInput.value;
        render();
        saveLocal();
      }

      function addElement(type) {
        const id = uid();
        const base = {
          id,
          type,
          x: 100 + Math.random() * 180,
          y: 100 + Math.random() * 110,
          w: type === 'text' ? 220 : 180,
          h: type === 'text' ? 80 : 160,
          color: type === 'text' ? '#111827' : type === 'circle' ? '#22c55e' : '#3b82f6',
          text: type === 'text' ? 'New text' : '',
          fontSize: 32,
          opacity: 100,
          rotation: 0
        };

        elements.push(base);
        selectedId = id;
        render();
        syncForm();
        saveLocal();
      }

      function duplicateSelected() {
        const el = getSelectedElement();
        if (!el) return;

        const clone = { ...el, id: uid(), x: el.x + 24, y: el.y + 24 };
        elements.push(clone);
        selectedId = clone.id;
        render();
        syncForm();
        saveLocal();
      }

      function deleteSelected() {
        if (!selectedId) return;

        const idx = elements.findIndex((el) => el.id === selectedId);
        elements = elements.filter((el) => el.id !== selectedId);

        if (elements.length === 0) {
          selectedId = null;
        } else {
          selectedId = elements[Math.max(0, idx - 1)]?.id || elements[0].id;
        }

        render();
        syncForm();
        saveLocal();
      }

      function moveLayer(direction) {
        if (!selectedId) return;
        const idx = elements.findIndex((el) => el.id === selectedId);
        if (idx === -1) return;

        const target = direction === 'front' ? elements.length - 1 : 0;
        if (idx === target) return;

        const [item] = elements.splice(idx, 1);
        if (direction === 'front') {
          elements.push(item);
        } else {
          elements.unshift(item);
        }

        render();
        saveLocal();
      }

      function alignSelected(mode) {
        const el = getSelectedElement();
        if (!el) return;

        if (mode === 'left') el.x = 10;
        if (mode === 'center') el.x = (canvas.clientWidth - el.w) / 2;
        if (mode === 'top') el.y = 10;

        render();
        syncForm();
        saveLocal();
      }

      function saveLocal() {
        localStorage.setItem('cva_style_layout', JSON.stringify(elements));
      }

      function loadLocal() {
        const raw = localStorage.getItem('cva_style_layout');
        if (!raw) return;

        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            elements = parsed;
            selectedId = elements[0]?.id || null;
            render();
            syncForm();
          }
        } catch (err) {
          console.error('Could not load layout:', err);
        }
      }

      function exportPng() {
        html2canvas(document.getElementById('canvas')).then((pngCanvas) => {
          const link = document.createElement('a');
          link.href = pngCanvas.toDataURL('image/png');
          link.download = 'design.png';
          link.click();
        });
      }

      document.getElementById('textBtn').addEventListener('click', () => addElement('text'));
      document.getElementById('rectBtn').addEventListener('click', () => addElement('rect'));
      document.getElementById('circleBtn').addEventListener('click', () => addElement('circle'));
      document.getElementById('imageBtn').addEventListener('click', () => imageUpload.click());
      document.getElementById('duplicateBtn').addEventListener('click', duplicateSelected);
      document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
      document.getElementById('frontBtn').addEventListener('click', () => moveLayer('front'));
      document.getElementById('backBtn').addEventListener('click', () => moveLayer('back'));
      document.getElementById('saveBtn').addEventListener('click', saveLocal);
      document.getElementById('loadBtn').addEventListener('click', loadLocal);
      document.getElementById('exportBtn').addEventListener('click', exportPng);

      xInput.addEventListener('input', updateSelected);
      yInput.addEventListener('input', updateSelected);
      wInput.addEventListener('input', updateSelected);
      hInput.addEventListener('input', updateSelected);
      colorInput.addEventListener('input', updateSelected);
      textInput.addEventListener('input', updateSelected);
      fontSizeInput.addEventListener('input', updateSelected);
      opacityInput.addEventListener('input', updateSelected);
      rotationInput.addEventListener('input', updateSelected);

      document.querySelectorAll('.swatch').forEach((swatch) => {
        swatch.addEventListener('click', () => {
          colorInput.value = swatch.dataset.color;
          updateSelected();
        });
      });

      document.getElementById('alignLeftBtn').addEventListener('click', () => alignSelected('left'));
      document.getElementById('alignCenterBtn').addEventListener('click', () => alignSelected('center'));
      document.getElementById('alignTopBtn').addEventListener('click', () => alignSelected('top'));

      imageUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const id = uid();
          elements.push({
            id,
            type: 'image',
            x: 170,
            y: 120,
            w: 260,
            h: 220,
            src: e.target.result,
            opacity: 100,
            rotation: 0,
            color: '#ffffff'
          });
          selectedId = id;
          render();
          syncForm();
          saveLocal();
        };
        reader.readAsDataURL(file);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (dragState && selectedId) {
          const el = getSelectedElement();
          if (!el) return;

          const dx = e.clientX - dragState.startX;
          const dy = e.clientY - dragState.startY;
          el.x = dragState.origX + dx;
          el.y = dragState.origY + dy;

          render();
          syncForm();
          saveLocal();
        }

        if (resizeState) {
          const el = elements.find((item) => item.id === resizeState.id);
          if (!el) return;

          const dx = e.clientX - resizeState.startX;
          const dy = e.clientY - resizeState.startY;

          if (resizeState.corner === 'se') {
            el.w = Math.max(40, resizeState.origW + dx);
            el.h = Math.max(40, resizeState.origH + dy);
          }
          if (resizeState.corner === 'sw') {
            el.x = resizeState.origX + dx;
            el.w = Math.max(40, resizeState.origW - dx);
            el.h = Math.max(40, resizeState.origH + dy);
          }
          if (resizeState.corner === 'ne') {
            el.y = resizeState.origY + dy;
            el.w = Math.max(40, resizeState.origW + dx);
            el.h = Math.max(40, resizeState.origH - dy);
          }
          if (resizeState.corner === 'nw') {
            el.x = resizeState.origX + dx;
            el.y = resizeState.origY + dy;
            el.w = Math.max(40, resizeState.origW - dx);
            el.h = Math.max(40, resizeState.origH - dy);
          }

          render();
          syncForm();
          saveLocal();
        }
      });

      document.addEventListener('pointerup', () => {
        dragState = null;
        resizeState = null;
      });

      canvas.addEventListener('pointerdown', (event) => {
        const clicked = event.target.closest('.element');
        if (!clicked) {
          selectedId = null;
          render();
        }
      });

      document.addEventListener('keydown', (event) => {
        const activeTag = document.activeElement && document.activeElement.tagName.toLowerCase();
        const typing = activeTag === 'input' || activeTag === 'textarea';

        if (typing) return;

        if ((event.key === 'Delete' || event.key === 'Backspace') && selectedId) {
          event.preventDefault();
          deleteSelected();
        }

        if ((event.ctrlKey || event.metaKey) && (event.key === 'd' || event.key === 'D')) {
          event.preventDefault();
          duplicateSelected();
        }
      });

      elements = [
        { id: uid(), type: 'text', x: 120, y: 90, w: 260, h: 90, text: 'Your Design', color: '#111827', fontSize: 40, opacity: 100, rotation: 0 },
        { id: uid(), type: 'rect', x: 120, y: 210, w: 320, h: 200, color: '#3b82f6', opacity: 100, rotation: 0 },
        { id: uid(), type: 'circle', x: 520, y: 230, w: 150, h: 150, color: '#22c55e', opacity: 100, rotation: 0 }
      ];
      selectedId = elements[0].id;

      render();
      syncForm();
      loadLocal();
    </script>
  </body>
</html>
