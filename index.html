<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canva-style Local Editor</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #171d27;
        --panel-2: #1f2833;
        --muted: #9ca8b8;
        --text: #edf2f7;
        --accent: #3b82f6;
        --canvas-bg: #f2f4f7;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        overflow: hidden;
      }

      .app {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      .sidebar {
        width: 290px;
        background: var(--panel);
        border-right: 1px solid rgba(255,255,255,0.08);
        padding: 18px;
      }

      .toolbar button,
      .action-buttons button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
        font-size: 14px;
        cursor: pointer;
        background: #2b3644;
        color: var(--text);
        transition: 0.15s ease;
      }

      .toolbar button:hover,
      .action-buttons button:hover {
        background: #38475f;
      }

      .toolbar {
        margin-bottom: 18px;
      }

      .panel {
        background: var(--panel-2);
        border-radius: 14px;
        padding: 14px;
        margin-top: 18px;
      }

      .panel h4 {
        margin: 0 0 12px;
        font-size: 12px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.08em;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      input[type="text"],
      input[type="number"],
      input[type="color"] {
        width: 100%;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
      }

      input[type="color"] {
        min-height: 38px;
        padding: 4px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      .workspace {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1420;
        padding: 28px;
      }

      .canvas {
        position: relative;
        width: min(84vw, 1000px);
        height: min(72vh, 680px);
        background: var(--canvas-bg);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
        user-select: none;
      }

      .element {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: move;
        border: 1px solid transparent;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .element.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(59,130,246,0.24);
      }

      .element.text {
        min-width: 80px;
        min-height: 32px;
        padding: 6px 10px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #111827;
        background: transparent;
      }

      .element.rect,
      .element.circle {
        border-radius: 10px;
      }

      .element.circle {
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="toolbar">
          <button id="addTextBtn">+ Text</button>
          <button id="addRectBtn">+ Rectangle</button>
          <button id="addCircleBtn">+ Circle</button>
        </div>

        <div class="panel">
          <h4>Selected</h4>
          <div class="meta-grid">
            <label>
              X
              <input id="xInput" type="number" value="0" />
            </label>
            <label>
              Y
              <input id="yInput" type="number" value="0" />
            </label>
            <label>
              W
              <input id="wInput" type="number" value="120" />
            </label>
            <label>
              H
              <input id="hInput" type="number" value="80" />
            </label>
            <label class="full-width">
              Text
              <input id="textInput" type="text" value="Edit me" />
            </label>
            <label class="full-width">
              Color
              <input id="colorInput" type="color" value="#ef4444" />
            </label>
          </div>
        </div>

        <div class="panel">
          <div class="action-buttons">
            <button id="saveBtn">Save layout</button>
            <button id="loadBtn">Load layout</button>
            <button id="downloadBtn">Download JSON</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <div id="canvas" class="canvas"></div>
      </main>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const xInput = document.getElementById('xInput');
      const yInput = document.getElementById('yInput');
      const wInput = document.getElementById('wInput');
      const hInput = document.getElementById('hInput');
      const textInput = document.getElementById('textInput');
      const colorInput = document.getElementById('colorInput');

      let elements = [];
      let selectedId = null;
      let dragState = null;

      function uid() {
        return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      }

      function getSelectedElement() {
        return elements.find((el) => el.id === selectedId) || null;
      }

      function syncForm() {
        const el = getSelectedElement();
        if (!el) return;

        xInput.value = Math.round(el.x);
        yInput.value = Math.round(el.y);
        wInput.value = Math.round(el.w);
        hInput.value = Math.round(el.h);
        textInput.value = el.text || '';
        colorInput.value = el.color || '#111827';
      }

      function render() {
        canvas.innerHTML = '';

        elements.forEach((el) => {
          const node = document.createElement('div');
          node.className = `element ${el.type} ${el.id === selectedId ? 'selected' : ''}`;
          node.dataset.id = el.id;
          node.style.left = `${el.x}px`;
          node.style.top = `${el.y}px`;
          node.style.width = `${el.w}px`;
          node.style.height = `${el.h}px`;

          if (el.type === 'text') {
            node.classList.add('text');
            node.style.fontSize = `${el.fontSize || 32}px`;
            node.style.color = el.color || '#111827';
            node.textContent = el.text || 'Text';
          } else {
            node.style.background = el.color || '#ef4444';
            node.style.borderRadius = el.type === 'circle' ? '50%' : '10px';
          }

          node.addEventListener('pointerdown', (event) => {
            selectedId = el.id;
            render();
            syncForm();

            dragState = {
              startX: event.clientX,
              startY: event.clientY,
              originalX: el.x,
              originalY: el.y
            };
          });

          node.addEventListener('dblclick', () => {
            if (el.type === 'text') {
              const nextText = prompt('Edit text:', el.text || '');
              if (nextText !== null) {
                el.text = nextText;
                render();
                syncForm();
                saveLocal();
              }
            }
          });

          canvas.appendChild(node);
        });
      }

      function updateSelected() {
        const el = getSelectedElement();
        if (!el) return;

        el.x = Number(xInput.value) || 0;
        el.y = Number(yInput.value) || 0;
        el.w = Number(wInput.value) || 80;
        el.h = Number(hInput.value) || 60;

        if (el.type === 'text') {
          el.text = textInput.value;
          el.color = colorInput.value;
        } else {
          el.color = colorInput.value;
        }

        render();
      }

      function addElement(type) {
        const id = uid();
        const base = {
          id,
          type,
          x: 90 + Math.random() * 140,
          y: 90 + Math.random() * 120,
          w: type === 'text' ? 220 : 150,
          h: type === 'text' ? 60 : 120,
          color: type === 'text' ? '#111827' : type === 'circle' ? '#22c55e' : '#ef4444',
          text: type === 'text' ? 'New text' : ''
        };

        elements.push(base);
        selectedId = id;
        render();
        syncForm();
        saveLocal();
      }

      function saveLocal() {
        localStorage.setItem('canva_local_layout', JSON.stringify(elements));
      }

      function loadLocal() {
        const raw = localStorage.getItem('canva_local_layout');
        if (!raw) return;

        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) {
            elements = parsed;
            selectedId = elements[0].id;
            render();
            syncForm();
          }
        } catch (error) {
          console.error('Could not load saved layout:', error);
        }
      }

      function downloadJson() {
        const blob = new Blob([JSON.stringify(elements, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'layout.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      // Inputs
      xInput.addEventListener('input', updateSelected);
      yInput.addEventListener('input', updateSelected);
      wInput.addEventListener('input', updateSelected);
      hInput.addEventListener('input', updateSelected);
      textInput.addEventListener('input', updateSelected);
      colorInput.addEventListener('input', updateSelected);

      document.getElementById('addTextBtn').addEventListener('click', () => addElement('text'));
      document.getElementById('addRectBtn').addEventListener('click', () => addElement('rect'));
      document.getElementById('addCircleBtn').addEventListener('click', () => addElement('circle'));
      document.getElementById('saveBtn').addEventListener('click', saveLocal);
      document.getElementById('loadBtn').addEventListener('click', loadLocal);
      document.getElementById('downloadBtn').addEventListener('click', downloadJson);

      // Canvas drag behavior
      canvas.addEventListener('pointermove', (event) => {
        if (!dragState || !selectedId) return;

        const el = getSelectedElement();
        if (!el) return;

        const dx = event.clientX - dragState.startX;
        const dy = event.clientY - dragState.startY;

        el.x = dragState.originalX + dx;
        el.y = dragState.originalY + dy;

        render();
        syncForm();
        saveLocal();
      });

      canvas.addEventListener('pointerup', () => {
        dragState = null;
      });

      canvas.addEventListener('pointerleave', () => {
        dragState = null;
      });

      canvas.addEventListener('pointerdown', (event) => {
        const node = event.target.closest('.element');
        if (!node) {
          selectedId = null;
          render();
          return;
        }
      });

      // Initial sample content
      elements = [
        { id: uid(), type: 'text', x: 120, y: 90, w: 220, h: 70, text: 'My Design', color: '#111827', fontSize: 42 },
        { id: uid(), type: 'rect', x: 110, y: 190, w: 250, h: 160, color: '#3b82f6', text: '' },
        { id: uid(), type: 'circle', x: 420, y: 220, w: 150, h: 150, color: '#22c55e', text: '' }
      ];
      selectedId = elements[0].id;

      render();
      syncForm();
    </script>
  </body>
</html>
